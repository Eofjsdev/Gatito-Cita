<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>¿Hacemos deploy de una cita? 🐱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Nunito:wght@400;700;800;900&display=swap">
<style>
:root{--bg:#f7f3ff;--card:#fff;--primary:#7c3aed;--primary-light:#ede9fe;--primary-dark:#5b21b6;--accent:#ec4899;--green:#10b981;--green-light:#d1fae5;--text:#1e1b4b;--muted:#6b7280;--border:#e5e7eb;--shadow:0 4px 24px rgba(124,58,237,.12);--radius:20px;--radius-sm:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(circle at 20% 20%,rgba(124,58,237,.08),transparent 50%),radial-gradient(circle at 80% 80%,rgba(236,72,153,.06),transparent 50%);font-family:'Nunito',sans-serif;color:var(--text);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer}
img{max-width:100%;display:block}
.wrap{max-width:460px;margin:0 auto;padding:20px 16px 40px}
.mono{font-family:'Fira Code',monospace}
.step{display:none;animation:slideUp .4s ease}.step.active{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes rain{from{top:-50px;opacity:1}to{top:110vh;opacity:0}}
.hero{text-align:center;padding:24px 0 8px}
.hero img{margin:0 auto;height:200px;width:auto;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 24px rgba(124,58,237,.35))}
h1{font-size:26px;font-weight:900;color:var(--primary-dark);margin-top:14px}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.plea{display:flex;gap:12px;align-items:center;background:var(--primary-light);border:2px solid rgba(124,58,237,.2);border-radius:var(--radius);padding:14px;margin:18px 0}
.plea img{height:64px;width:auto;flex-shrink:0}
.plea b{color:var(--primary-dark);font-size:14px}
.btn{display:block;width:100%;border:none;border-radius:var(--radius-sm);padding:14px 20px;font-weight:800;font-size:13px;letter-spacing:.5px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:0 4px 12px rgba(124,58,237,.3);margin-top:14px}
.btn.pink{background:linear-gradient(135deg,var(--accent),#db2777)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:16px;text-align:center}
.card .qimg{height:90px;width:auto;margin:0 auto 8px}
.tag{font-family:'Fira Code',monospace;font-size:10px;color:var(--primary);margin-bottom:6px}
.qtext{font-size:18px;font-weight:800;line-height:1.4}
.prog{font-family:'Fira Code',monospace;font-size:10px;color:var(--muted);margin:8px 0 6px;display:flex;justify-content:space-between}
.bar{height:6px;background:var(--primary-light);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;background:#fff;border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-weight:700;font-size:13px;color:var(--text)}
.opt.sel{border-color:var(--primary);background:var(--primary-light)}
.err{display:none;color:var(--accent);font-family:'Fira Code',monospace;font-size:10px;margin-top:8px;text-align:center}
.yn{position:relative;height:140px;display:flex;align-items:center;justify-content:center;gap:16px}
.yes{background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-weight:900;font-size:18px;padding:16px 40px;transition:all .2s}
.no{background:#fff;color:var(--muted);border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;padding:12px 24px}
input[type=date],input[type=time]{width:100%;font:inherit;font-weight:700;padding:12px;border:2px solid var(--border);border-radius:var(--radius-sm);margin-top:8px;color:var(--text);background:#fff}
.lbl{font-family:'Fira Code',monospace;font-size:10px;color:var(--muted);margin-top:12px;text-align:left}
.sum{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;margin:12px 0;font-size:11px}
.sum div{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}.sum div:nth-child(even){background:var(--bg)}.sum div:last-child{border:none}
.sum em{font-style:normal;font-size:16px;width:24px;text-align:center}.sum small{font-family:'Fira Code',monospace;font-size:9px;color:var(--muted)}.sum b{flex:1;word-break:break-word}
.finale{display:none;text-align:center;padding:16px;background:var(--green-light);border:2px solid rgba(16,185,129,.3);border-radius:var(--radius);margin-top:14px}
.finale h3{font-size:18px;font-weight:900;color:var(--green);margin:8px 0 6px}
.finale p{font-family:'Fira Code',monospace;font-size:10px;color:#065f46;line-height:1.6}
.cat{position:fixed;height:90px;width:auto;pointer-events:none;animation:rain linear forwards;z-index:9999;top:-120px}
@keyframes ledBlink{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes ledColors{0.00%{background:#ff2d55;box-shadow:0 0 10px 3px #ff2d55} 12.50%{background:#ff9500;box-shadow:0 0 10px 3px #ff9500} 25.00%{background:#ffd60a;box-shadow:0 0 10px 3px #ffd60a} 37.50%{background:#30d158;box-shadow:0 0 10px 3px #30d158} 50.00%{background:#00e5ff;box-shadow:0 0 10px 3px #00e5ff} 62.50%{background:#0a84ff;box-shadow:0 0 10px 3px #0a84ff} 75.00%{background:#bf5af2;box-shadow:0 0 10px 3px #bf5af2} 87.50%{background:#ff6bd6;box-shadow:0 0 10px 3px #ff6bd6} 100%{background:#ff2d55;box-shadow:0 0 10px 3px #ff2d55}}
.led{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;width:11px;height:11px;border-radius:50%;z-index:10000;pointer-events:none;animation:ledBlink 2.5s ease-in-out infinite,ledColors 20.0s step-end infinite}
@media (prefers-reduced-motion:reduce){.led{animation:ledColors 20.0s step-end infinite}}
@keyframes reactionPop{0%{opacity:0;transform:translateY(8px) scale(.9)}100%{opacity:1;transform:none}}
.cat-reaction{margin-top:10px;padding:9px 12px;background:var(--primary-light);border:2px solid rgba(124,58,237,.2);border-radius:var(--radius-sm);color:var(--primary-dark);font-weight:800;font-size:13px;text-align:center;animation:reactionPop .3s ease;display:none}
@keyframes mascotBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes bubbleOut{to{opacity:0;transform:translateY(6px)}}
.pets{position:fixed;left:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);width:100%;height:0;z-index:9000;pointer-events:none}
.pet{position:absolute;left:0;bottom:0;width:48px;height:48px;image-rendering:pixelated;will-change:transform}
.pet-ball{position:absolute;left:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#00e5ff;box-shadow:0 0 8px 2px rgba(0,229,255,.7);display:none;will-change:transform}
.pet-bubble{position:absolute}
.mascot-bubble{max-width:210px;padding:8px 12px;background:#fff;border:2px solid var(--primary);border-radius:14px 14px 4px 14px;color:var(--primary-dark);font-weight:800;font-size:12px;line-height:1.35;box-shadow:var(--shadow);animation:reactionPop .3s ease,bubbleOut .4s ease 4.6s forwards}
.release-notes{margin:12px 0 4px;padding:10px 12px;background:var(--card);border:1px dashed rgba(124,58,237,.4);border-radius:var(--radius-sm);font-family:'Fira Code',monospace;font-size:10px;color:var(--muted);line-height:1.7}
.release-notes b{color:var(--primary)}
#pdf{position:absolute;left:-9999px;top:0;width:148mm;background:#fff;font-family:'Nunito',sans-serif;padding:18px}
</style>
</head>
<body>
<span class="led" aria-hidden="true"></span>
<div class="pets" id="pets" aria-hidden="true"><img class="pet"><img class="pet"><img class="pet"><div class="pet-ball" id="pball"></div><div class="mascot-bubble pet-bubble" id="mbubble" style="display:none"></div></div>
<div class="wrap" id="app"></div>
<p class="mono" style="text-align:center;font-size:10px;color:var(--muted);padding:0 0 24px">Hecho con 💜 por Ángel Said · <a href="https://github.com/Eofjsdev" style="color:var(--primary)">@Eofjsdev</a></p>
<div id="cats"></div>
<div id="pdf"></div>

const MASCOT_CHEERS=['¡Sigue así, dev! 🐾','Buen ritmo ⚡','Yo creo en ti 💜','Una pregunta menos, un bug menos 🐛','¡Qué buen equipo hacemos! 🐱'];
let mascotTimer=null;
function mascotMessage(q,total){
  if(q===1)return '¡Empezamos, dev! Yo te acompaño 🐱';
  if(q===total)return '¡Última pregunta! 🏁';
  if(q===Math.ceil(total*.25))return '¡Primer cuarto listo! 💪';
  if(q===Math.ceil(total*.5))return '¡Vas por la mitad, dev! 💪';
  if(q===Math.ceil(total*.75))return '¡Ya solo falta un cuarto! 🔥';
  if(q===Math.round(total*.9))return 'Ya casi, no te rindas 🐱';
  if(q%7===0)return MASCOT_CHEERS[Math.floor(q/7)%MASCOT_CHEERS.length];
  return null;
}
function updateMascot(n){
  let msg=null;
  if(n>=3&&n<3+TOTAL)msg=mascotMessage(n-2,TOTAL);
  else if(n===3+TOTAL)msg='¡Último paso, dev! Solo falta aceptar 💜';
  const b=$('#mbubble');
  clearTimeout(mascotTimer);
  if(!msg){b.style.display='none';return}
  b.style.display='none';void b.offsetWidth;b.textContent=msg;b.style.display='block';
  mascotTimer=setTimeout(()=>{b.style.display='none'},5000);
}
function show(n){updateMascot(n);document.querySelectorAll('.step').forEach((s)=>s.classList.remove('active'));$('#s'+n).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function go(n){show(n)}
function rainCats(count){
  const pool=[IMG.c1,IMG.c2,IMG.c3,IMG.c4,IMG.c5];
  for(let i=0;i<count;i++)setTimeout(()=>{const im=document.createElement('img');im.className='cat';im.src=pool[Math.floor(Math.random()*pool.length)];im.style.left=Math.random()*95+'%';im.style.animationDuration=2.5+Math.random()*3+'s';$('#cats').appendChild(im);setTimeout(()=>im.remove(),7000)},i*150);
}
function pick(q,btn){
  const r=$('#r'+q);
  if(r){r.style.display='none';void r.offsetWidth;r.textContent=CAT_REACTIONS[Math.floor(Math.random()*CAT_REACTIONS.length)];r.style.display='block'}
  rainCats((q-2)%BIG_RAIN_EVERY===0?BIG_RAIN_CATS:CATS_PER_ANSWER);
ans[q]=btn.textContent;document.querySelectorAll(`.opt[data-q="${q}"]`).forEach((b)=>b.classList.toggle('sel',b===btn));$('#e'+q).style.display='none'}
function next(q){if(!ans[q]){$('#e'+q).style.display='block';return}if(q+1===SUMMARY)buildSummary();show(q+1)}
function pickDate(){const f=$('#fecha').value,h=$('#hora').value;if(!f||!h){$('#e2').style.display='block';return}const [y,m,d]=f.split('-');ans[2]=`${d}/${m}/${y} a las ${h}`;show(3)}

function escapeNo(e){
  if(e)e.preventDefault();
  noTries=Math.min(noTries+1,5);
  const yes=$('#yes'),no=$('#no'),box=$('#yn');
  yes.style.fontSize=Math.min(18+noTries*4,42)+'px';
  yes.style.padding=Math.min(16+noTries*4,32)+'px '+Math.min(40+noTries*8,64)+'px';
  no.style.position='absolute';
  no.style.fontSize=Math.max(14-noTries,8)+'px';
  no.style.left=Math.random()*Math.max(box.offsetWidth-no.offsetWidth-20,40)+'px';
  no.style.top=(Math.random()*100-10)+'px';
  const m=$('#nomsg');m.style.display='block';
  m.textContent=noTries>=5?'// el "No" ya no existe en el sistema 😼💜':'// error: opción no válida 😼';
}

function items(){
  const arr=QS.map((q)=>({k:q.key,i:q.icon,v:ans[q.id]||'—'}));
  arr.splice(2,0,{k:'cita',i:'📅',v:ans[2]||'—'});
  return arr;
}
function buildSummary(){$('#sum').innerHTML=items().map((x)=>`<div><em>${x.i}</em><small>${esc(x.k)}://</small><b>${esc(x.v)}</b></div>`).join('')}

async function sendEmail(){
  try{
    const body={_subject:ASUNTO,_template:'table',_captcha:'false',folio:'Cita #'+folio,emitida:emitida,fecha_y_hora:ans[2]||'—',respuesta_final:'SÍ, ACEPTO LOS TÉRMINOS Y CONDICIONES ✅'};
    QS.forEach((q)=>{body[q.key]=ans[q.id]||'—'});
    await fetch('https://formsubmit.co/ajax/'+CORREO,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)});
  }catch(err){console.error('Error enviando por correo:',err)}
}

function celebrate(){
  let n=1;
  try{n=(parseInt(localStorage.getItem('cita_folio')||'0',10)||0)+1;localStorage.setItem('cita_folio',String(n))}catch(e){}
  folio=String(n).padStart(4,'0');
  const d=new Date(),t=(v)=>String(v).padStart(2,'0');
  emitida=`${t(d.getDate())}/${t(d.getMonth()+1)}/${d.getFullYear()} a las ${t(d.getHours())}:${t(d.getMinutes())}`;
  $('#accept').style.display='none';$('#fin').style.display='block';$('#pdfbtn').style.display='block';
  const pool=[IMG.c1,IMG.c2,IMG.c3,IMG.c4,IMG.c5];
  for(let i=0;i<16;i++)setTimeout(()=>{const im=document.createElement('img');im.className='cat';im.src=pool[Math.floor(Math.random()*pool.length)];im.style.left=Math.random()*95+'%';im.style.animationDuration=3+Math.random()*4+'s';$('#cats').appendChild(im);setTimeout(()=>im.remove(),8000)},i*200);
  sendEmail();
}

}

/* ===== Gatitos pixelados que caminan por abajo (como las mascotas de VS Code) ===== */
(function(){
  const els=[...document.querySelectorAll('#pets .pet')],ballEl=$('#pball'),bub=$('#mbubble');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=window.innerWidth;window.addEventListener('resize',()=>{W=window.innerWidth});
  const rand=(a,b)=>a+Math.random()*(b-a);
  const pets=PET_COLORS.map((_,i)=>({x:rand(10,Math.max(20,W-PET_SIZE-10))*(.3+i*.3),y:0,dir:Math.random()<.5?1:-1,mode:'walk',until:performance.now()+rand(1500,4000),wall:null,climbDir:1}));
  const ball={on:false,x:0,y:0,vx:0,vy:0,until:0,nextAt:performance.now()+6000};
  function draw(i,frame){
    const el=els[i],p=pets[i],src=PET_FRAMES[PET_COLORS[i]][frame];
    if(el.dataset.f!==frame){el.src=src;el.dataset.f=frame}
    let tf=`translate(${p.x}px,${-p.y}px)`;
    if(p.mode==='climb'){
      if(p.wall==='l')tf+=p.climbDir===1?' rotate(90deg) scaleX(-1)':' rotate(90deg)';
      else tf+=p.climbDir===1?' rotate(-90deg)':' rotate(-90deg) scaleX(-1)';
    }else if(p.dir===-1)tf+=' scaleX(-1)';
    el.style.transform=tf;
  }
  if(reduce){pets.forEach((p,i)=>{p.mode='sit';p.x=20+i*70;draw(i,'sit')});return}
  let last=performance.now();
  function tick(now){
    const dt=Math.min((now-last)/1000,.05);last=now;
    if(!ball.on&&now>ball.nextAt){ball.on=true;ball.x=rand(W*.2,W*.8);ball.y=0;ball.vx=rand(-140,140);ball.vy=rand(380,520);ball.until=now+7000}
    if(ball.on){
      ball.vy-=900*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
      if(ball.y<=0){ball.y=0;ball.vy=Math.abs(ball.vy)*.62;if(ball.vy<40)ball.vy=0;ball.vx*=.8}
      if(ball.x<6||ball.x>W-18){ball.vx*=-1;ball.x=Math.min(Math.max(ball.x,6),W-18)}
      if(now>ball.until){ball.on=false;ball.nextAt=now+rand(9000,16000)}
    }
    ballEl.style.display=ball.on?'block':'none';
    ballEl.style.transform=`translate(${ball.x}px,${-ball.y}px)`;
    pets.forEach((p,i)=>{
      const speed=38+i*8;
      if(p.mode==='climb'){
        p.y+=p.climbDir*42*dt;
        if(p.climbDir===1&&now>p.until)p.climbDir=-1;
        if(p.climbDir===-1&&p.y<=0){p.y=0;p.mode='walk';p.dir=p.wall==='l'?1:-1;p.x=p.wall==='l'?2:W-PET_SIZE-2;p.wall=null;p.until=now+rand(2000,5000)}
        draw(i,Math.floor(now/220)%2?'walk1':'walk2');return;
      }
      if(ball.on&&ball.y<70){
        const target=ball.x-PET_SIZE/2;
        if(Math.abs(target-p.x)>8){p.mode='walk';p.dir=target>p.x?1:-1;p.x+=p.dir*(speed+30)*dt;draw(i,Math.floor(now/140)%2?'walk1':'walk2')}
        else{p.mode='walk';draw(i,'stand')}
      }else if(p.mode==='walk'){
        p.x+=p.dir*speed*dt;
        const maxX=W-PET_SIZE;
        if(p.x<=0||p.x>=maxX){
          p.x=p.x<=0?0:maxX;
          if(Math.random()<.35){p.mode='climb';p.wall=p.x<=0?'l':'r';p.climbDir=1;p.until=now+rand(1500,3200)}
          else p.dir=p.dir===1?-1:1;
        }
        if(now>p.until&&p.mode==='walk'){
          const r=Math.random();p.mode=r<.55?'walk':r<.8?'sit':'lie';p.until=now+rand(2200,6000);
          if(p.mode==='walk'&&Math.random()<.5)p.dir=p.dir===1?-1:1;
        }
        draw(i,Math.floor(now/180)%2?'walk1':'walk2');
      }else{
        if(now>p.until){p.mode='walk';p.until=now+rand(2500,6000)}
        draw(i,p.mode==='walk'?'stand':p.mode);
      }
    });
    if(bub.style.display!=='none'){
      const p=pets[0],w=bub.offsetWidth;
      bub.style.left=Math.min(Math.max(p.x+PET_SIZE/2-w/2,6),W-w-6)+'px';
      bub.style.bottom=(PET_SIZE+Math.max(p.y,0)+8)+'px';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
